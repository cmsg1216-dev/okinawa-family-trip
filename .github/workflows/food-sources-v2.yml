name: Add food source metadata and curated cafes

on:
  push:
    paths:
      - '.github/workflows/food-sources-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch food data and UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')

          css=r'''
          /* food-sources-v2 */
          .food-filter-wrap{margin:12px 0 18px}.food-filter-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:7px 0}.food-filter-label{font-size:10px;font-weight:800;color:#999;min-width:38px}.food-filter-row button{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:750;cursor:pointer}.food-filter-row button.active{background:var(--ink);border-color:var(--ink);color:#fff}.food-meta-tags,.source-tags{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.genre-pill,.style-pill,.source-pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:800;line-height:1.3;text-decoration:none}.genre-pill{background:#f1f1ed;color:#555}.style-pill{background:#fff0ec;color:#b15140}.source-pill{background:#f7f7f4;color:#555;border:1px solid #e7e7e2}.source-pill.tabelog{background:#fff7e7;color:#8b5a08;border-color:#f1dfb7}.source-pill.savor{background:#f0f6ff;color:#315b92;border-color:#d9e6f8}.source-pill.tc{background:#eff8f5;color:#2f6e5c;border-color:#d5e8e1}.source-pill.warn{background:#fff0ed;color:#b64d3d;border-color:#f3d4ce}.filter-note{font-size:10px;color:#92928c;margin-top:4px}.food-count-note{font-size:10px;color:#999;margin-left:4px}.cafe-card{position:relative}.cafe-card:after{content:'CAFE';position:absolute;right:14px;bottom:14px;font-size:8px;font-weight:900;letter-spacing:.12em;color:#c6c0b9}.new-mark{color:#b15140;font-size:9px;font-weight:850;margin-left:5px}.rank-line{font-size:10px;color:#7b6a45;margin:1px 0 6px}.status-warn{font-size:10px;color:#b64d3d;font-weight:750;margin:2px 0 6px}
          @media(max-width:760px){.food-filter-row{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}.food-filter-row::-webkit-scrollbar{display:none}.food-filter-label{position:sticky;left:0;background:var(--bg);z-index:2;padding-right:3px}.food-filter-row button{white-space:nowrap}.cafe-card:after{display:none}}
          '''
          if '/* food-sources-v2 */' not in html:
              html=html.replace('</style>',css+'\n</style>',1)

          script=r'''
          <script>
          (function(){
            if(window.__foodSourcesV2 || typeof P==='undefined') return;
            window.__foodSourcesV2=true;

            const meta={
              'Kishimoto Shokudo Yaedake':{genre:'오키나와 소바',style:'로컬·노포',score:'3.50',reviews:'701',tabelog:'https://tabelog.com/okinawa/A4702/A470202/47000957/'},
              '야키니쿠 모토부목장 본부점':{genre:'야키니쿠',style:'브랜드 와규',score:'3.24',reviews:'129',tabelog:'https://tabelog.com/okinawa/A4702/A470202/47004571/'},
              '피자 찻집 카진호 (花人逢)':{genre:'피자·카페',style:'절경·고택',score:'3.56',reviews:'768',tabelog:'https://tabelog.com/okinawa/A4702/A470202/47000232/',status:'9/23 수요일 휴무 → 이번 일정 제외'},
              'fuu cafe':{genre:'카페·런치',style:'정원·숲',score:'3.51',reviews:'268',rank:'세소코 런치 #1',tabelog:'https://tabelog.com/okinawa/C47308/C117607/rstLst/lunch/',savor:'https://kr.savorjapan.com/0006057473',status:'9/23 수요일 휴무 → 이번 일정 제외'},
              'Eibun':{genre:'오키나와 소바',style:'모던 로컬',score:'3.68',reviews:'1336',rank:'국제거리 오키나와요리 런치 #1',tabelog:'https://tabelog.com/okinawa/A4701/A470101/PS48/rstLst/lunch/okinawafood/'},
              'Yunangi':{genre:'오키나와 현지식',style:'전통요리',score:'3.57',reviews:'1292',rank:'국제거리 주변 오키나와요리 #16',tabelog:'https://tabelog.com/okinawafood/okinawa/S7/S127428/COND-0-0-0-0-0-0-0-0/D-rt/'},
              'Yakiniku MOTOBU FARM Kokusai Street':{genre:'야키니쿠',style:'브랜드 와규',tc:'https://www.tablecheck.com/en/shops/motobu-farm-kokusai/reserve'},
              'C&C BREAKFAST OKINAWA':{genre:'브런치·팬케이크',style:'밝은·캐주얼',score:'3.49',reviews:'298',tabelog:'https://tabelog.com/okinawa/A4701/A470101/47014183/'},
              'BETTER GIRL':{genre:'브런치·커피',style:'미니멀·모던',score:'3.47',reviews:'144',tabelog:'https://tabelog.com/okinawa/A4701/A470101/47024394/'},
              'TAMAGUSUKU COFFEE ROASTERS':{genre:'스페셜티 커피',style:'로스터리·미니멀',score:'3.19',reviews:'39',tabelog:'https://tabelog.com/okinawa/A4701/A470101/47017360/'},
              'CAFE STRATA':{genre:'브런치·갈레트',style:'호텔·가든',score:'3.32',reviews:'73',tabelog:'https://tabelog.com/okinawa/A4701/A470101/47026076/'},
              'OCREPE':{genre:'크레페·디저트',style:'포토제닉·플라워',score:'3.10',reviews:'26',tabelog:'https://tabelog.com/okinawa/A4701/A470101/47013398/'},
              'A LONG VACATION.':{genre:'이탈리안·카페',style:'테라스·호텔',score:'3.53',reviews:'246',rank:'국제거리 주변 카페 #3',tabelog:'https://tabelog.com/cafe/okinawa/S7/S127428/COND-0-0-0-0-0-0-0-0/D-rt/',tc:'https://www.tablecheck.com/en/shops/southwestgrand-dining/reserve'},
              'SHIKAKU NAHA':{genre:'일식·아구샤브',style:'호텔 다이닝',tc:'https://www.tablecheck.com/ko/southwestgrand-washoku',savor:'https://kr.savorjapan.com/contents/discover-oishii-japan/restaurants-to-visit-after-walking-along-kokusai-dori-naha-okinawa'},
              'Shima ShabuShabu NAKAMA':{genre:'아구샤브·오키나와요리',style:'가족·한국어메뉴',savor:'https://kr.savorjapan.com/0006096856/menus'},
              'Yakiniku Ryukyu no Ushi':{genre:'야키니쿠',style:'예약·와규',tc:'https://www.tablecheck.com/en/shops/yakiniku-naha/reserve'},
              'Cafe Koku':{genre:'오키나와 채소·카페',style:'야치문·자연',savor:'https://kr.savorjapan.com/0006057204/'},
              'MOCO SALT COFFEE':{genre:'스페셜티 커피',style:'후쿠기·미니멀',score:'3.05',reviews:'5',tabelog:'https://tabelog.com/okinawa/A4702/A470202/47033194/'},
              'Bottle Palm Garden':{genre:'카페·디저트',style:'그린·세소코',score:'3.26',reviews:'48',rank:'세소코 런치 #2',tabelog:'https://tabelog.com/okinawa/C47308/C117607/rstLst/lunch/'},
              'MOKULELE':{genre:'브런치·하와이안',style:'오션뷰',score:'3.35',reviews:'128',tabelog:'https://tabelog.com/okinawa/A4702/A470202/47025984/'},
              '亜熱帯茶屋':{genre:'카페·런치',style:'절경·테라스',score:'3.43',reviews:'152',tabelog:'https://tabelog.com/okinawa/A4702/A470202/47015951/dtlmap'},
              'Hotel Collective All Day Dining':{genre:'호텔 다이닝',style:'호텔 내·편한 동선',tc:'https://www.tablecheck.com/ko/shops/hotelcollective-all-day-dining/reserve'}
            };

            const extras=[
              {a:'9/23 세소코',t:'카페',q:'Bottle Palm Garden Sesoko Okinawa',n:'Bottle Palm Garden',r:'3.26',v:'Tabelog 48',g:'🌿 세소코 감성',w:'세소코에서 fuu cafe 대안으로 보기 좋은 자연형 카페. 이번 일정 수요일 후보.',b:'주차/아기편의는 방문 전 확인'},
              {a:'9/23 모토부',t:'카페',q:'MOKULELE Motobu Okinawa',n:'MOKULELE',r:'3.35',v:'Tabelog 128',g:'🌊 오션 브런치',w:'바다를 보며 하와이안 계열 브런치와 디저트를 즐기는 모토부 카페.',b:'예약 가능 표기 · 좌석/유모차는 당일 확인'},
              {a:'9/23 모토부',t:'카페',q:'亜熱帯茶屋 Motobu Okinawa',n:'亜熱帯茶屋',r:'3.43',v:'Tabelog 152',g:'🌴 절경 테라스',w:'고지대에서 바다를 내려다보는 테라스와 해먹 분위기가 강점. 사진과 공간 우선이면 상위 후보.',b:'목요일 휴무 · 9/23 수요일 일정 가능'},
              {a:'9/23 비세',t:'카페',q:'MOCO SALT COFFEE Bise Okinawa',n:'MOCO SALT COFFEE',r:'3.05',v:'Tabelog 5',g:'◻ 후쿠기 미니멀',w:'비세 후쿠기길 안쪽의 작은 솔트커피 카페. 관광형 대형카페보다 깔끔한 로컬 분위기.',b:'13:00~18:30 · 부정기휴무는 Instagram 확인'},
              {a:'9/23 나키진',t:'카페',q:'カフェ こくう Nakijin Okinawa',n:'Cafe Koku',r:'—',v:'SAVOR JAPAN',g:'🏺 야치문·자연',w:'오키나와 채소 요리와 현지 도예가의 야치문이 어우러지는 공간. 디자인 취향이라면 우회할 가치가 있는 후보.',b:'SAVOR: 어린아이 동반 이용 쉬운 공간 · 다다미 · 화~토 영업'},
              {a:'9/24 국제거리',t:'카페',q:'C&C BREAKFAST OKINAWA',n:'C&C BREAKFAST OKINAWA',r:'3.49',v:'Tabelog 298',g:'🥞 브런치',w:'팬케이크·아사이볼·샌드위치가 중심인 밝은 브런치 카페. 사진과 아침/가벼운 점심 모두 좋음.',b:'예약 불가 · 대기 가능'},
              {a:'9/24 겐초마에',t:'카페',q:'BETTER GIRL Naha Okinawa',n:'BETTER GIRL',r:'3.47',v:'Tabelog 144',g:'◻ 미니멀 브런치',w:'겐초마에 바로 근처의 아틀리에형 미니멀 브런치 카페. 공간 디자인 취향으로 넣기 좋은 후보.',b:'07:00~14:00 · 예약 불가'},
              {a:'9/24 국제거리',t:'카페',q:'TAMAGUSUKU COFFEE ROASTERS Naha',n:'TAMAGUSUKU COFFEE ROASTERS',r:'3.19',v:'Tabelog 39',g:'☕ 로스터리',w:'관광형 카페보다 커피 자체에 집중한 소형 로스터리. 차분하고 미니멀한 분위기.',b:'목요일 10:30~17:00 · 10석 · 예약 불가'},
              {a:'9/24 미에바시',t:'카페',q:'CAFE STRATA Naha Okinawa',n:'CAFE STRATA',r:'3.32',v:'Tabelog 73',g:'🌿 호텔 가든',w:'중정과 큰 창이 있는 호텔 카페. 갈레트와 브런치 중심으로 공간이 깔끔하고 유모차 동선도 비교적 편한 편.',b:'미에바시역 30초 · 무휴 · 예약 가능'},
              {a:'9/24 국제거리',t:'카페',q:'OCREPE Naha Okinawa',n:'OCREPE',r:'3.10',v:'Tabelog 26',g:'🌸 포토제닉',w:'앤티크와 플라워 인테리어의 쌀가루 크레페 카페. 와이프 취향 후보로 넣기 좋은 포토제닉 공간.',b:'목요일 11:00~16:30 · 예약 가능'},
              {a:'9/24 국제거리',t:'카페',q:'A LONG VACATION Southwest Grand Hotel Okinawa',n:'A LONG VACATION.',r:'3.53',v:'Tabelog 246',g:'🏨 테라스 카페',w:'Southwest Grand Hotel 1층의 테라스형 올데이다이닝. 국제거리 주변 카페 랭킹 상위권이며 TableCheck 예약 가능.',b:'카페 11:00~17:00 · TableCheck 예약'},
              {a:'9/24 국제거리',t:'식당',q:'SHIKAKU NAHA Southwest Grand Hotel',n:'SHIKAKU NAHA',r:'—',v:'TableCheck',g:'🍲 아구샤브',w:'호텔 안에서 오키나와 식재료와 아구샤브를 깔끔한 공간에서 즐기는 선택. 예약형 저녁 후보.',b:'TableCheck 예약 · 좌석요청 보장 안 됨'},
              {a:'9/24 국제거리',t:'식당',q:'Shima ShabuShabu NAKAMA Naha',n:'Shima ShabuShabu NAKAMA',r:'—',v:'SAVOR JAPAN',g:'👶 가족 샤브',w:'겐초마에 도보권의 아구샤브·오키나와요리. SAVOR JAPAN에서 어린이 동반 환영과 한국어 메뉴를 확인할 수 있는 가족형 후보.',b:'어린이 동반 환영 · 한국어 메뉴 · 예약접수'},
              {a:'9/24 국제거리',t:'식당',q:'Yakiniku Ryukyu no Ushi Naha Kokusai-dori',n:'Yakiniku Ryukyu no Ushi',r:'—',v:'TableCheck',g:'🥩 예약 야키니쿠',w:'국제거리에서 온라인 예약으로 저녁 시간을 확정하고 싶을 때 좋은 야키니쿠 후보.',b:'TableCheck 온라인 예약 · 16:30~23:00'},
              {a:'9/24 국제거리',t:'식당',q:'Hotel Collective All Day Dining Naha',n:'Hotel Collective All Day Dining',r:'—',v:'TableCheck',g:'🏨 최저스트레스',w:'이린이가 지치거나 비가 올 때 이동 없이 호텔 안에서 해결하는 가장 편한 Plan B.',b:'숙소 4F · TableCheck 예약 가능'}
            ];
            const existing=new Set(P.map(x=>x.n));extras.forEach(x=>{if(!existing.has(x.n))P.push(x)});
            P.forEach(p=>{const m=meta[p.n];if(m)Object.assign(p,m);if(!p.genre)p.genre=p.t==='카페'?'카페':'기타';if(!p.style)p.style=p.t==='카페'?'카페':'식사';});
            const food=document.getElementById('food');if(!food)return;
            const old=food.querySelector('.filters');if(old)old.outerHTML=`<div class="food-filter-wrap"><div class="food-filter-row"><span class="food-filter-label">지역</span><button class="active" data-area="all">전체</button><button data-area="9/22">9/22 라이카무</button><button data-area="9/23">9/23 북부</button><button data-area="9/24">9/24 나하</button></div><div class="food-filter-row"><span class="food-filter-label">장르</span><button class="active" data-genre="all">전체</button><button data-genre="카페">카페 전체</button><button data-genre="오키나와 소바">오키나와 소바</button><button data-genre="해산물">해산물</button><button data-genre="야키니쿠">야키니쿠</button><button data-genre="스시">스시·일식</button><button data-genre="브런치">브런치</button><button data-genre="오션뷰">오션뷰</button><button data-genre="스페셜티">스페셜티 커피</button><button data-genre="디저트">디저트</button><button data-genre="미니멀">미니멀</button><button data-genre="야치문">야치문·로컬</button></div><div class="filter-note">Tabelog 평점·랭킹은 2026-09-17 조회 기준. SAVOR JAPAN / TableCheck는 등재·예약 가능 여부를 별도 표시합니다.</div></div>`;
            let area='all',genre='all';
            window.cards=function(){const box=document.getElementById('cards');box.innerHTML='';let visible=0;P.forEach((p,i)=>{const aok=area==='all'||p.a.includes(area);const hay=[p.t,p.genre,p.style,p.n].join(' ');const gok=genre==='all'||hay.includes(genre);if(!aok||!gok)return;visible++;const e=document.createElement('article');e.className='card '+(p.t==='카페'?'cafe-card':'');let src='';if(p.tabelog)src+=`<a class="source-pill tabelog" target="_blank" href="${p.tabelog}">食べログ${p.score?' '+p.score:''}${p.reviews?' · '+p.reviews+'건':''}</a>`;if(p.savor)src+=`<a class="source-pill savor" target="_blank" href="${p.savor}">SAVOR JAPAN</a>`;if(p.tc)src+=`<a class="source-pill tc" target="_blank" href="${p.tc}">TableCheck 예약</a>`;e.innerHTML='<label class="save"><input type="checkbox" '+(saved(i)?'checked':'')+'> 후보 저장</label><div class="meta">'+esc(p.a)+' · '+esc(p.t)+'</div><h3>'+esc(p.n)+(i>=38?'<span class="new-mark">NEW</span>':'')+'</h3><div class="food-meta-tags"><span class="genre-pill">'+esc(p.genre)+'</span><span class="style-pill">'+esc(p.style)+'</span></div>'+(p.rank?'<div class="rank-line">🏅 Tabelog '+esc(p.rank)+'</div>':'')+(p.status?'<div class="status-warn">⚠ '+esc(p.status)+'</div>':'')+'<div class="source-tags">'+src+'</div><span class="rate">★ '+esc(p.r)+'</span> <span class="meta">'+esc(p.v)+'</span><br><span class="tag">'+esc(p.g)+'</span><p>'+esc(p.w)+'</p><div class="baby">👶 '+esc(p.b)+'</div><div class="actions"><a class="btn" target="_blank" href="'+gs(p.q)+'">Google 지도</a><a class="btn alt" target="_blank" href="'+gd(p.q)+'">현재 위치 길찾기</a></div>';e.querySelector('input').onchange=x=>{localStorage.setItem(sk(i),x.target.checked?'1':'0');refresh()};box.appendChild(e)});document.getElementById('savedN').textContent=P.filter((_,i)=>saved(i)).length;let n=food.querySelector('.food-count-note');if(!n){n=document.createElement('span');n.className='food-count-note';document.getElementById('savedN').parentElement.appendChild(n)}n.textContent=' · 현재 '+visible+'곳 표시'};
            food.querySelectorAll('[data-area]').forEach(b=>b.addEventListener('click',()=>{food.querySelectorAll('[data-area]').forEach(x=>x.classList.remove('active'));b.classList.add('active');area=b.dataset.area;cards()}));
            food.querySelectorAll('[data-genre]').forEach(b=>b.addEventListener('click',()=>{food.querySelectorAll('[data-genre]').forEach(x=>x.classList.remove('active'));b.classList.add('active');genre=b.dataset.genre;cards()}));
            cards();maprender();
          })();
          </script>
          '''
          html=html.replace('</body>',script+'\n</body>',1)
          p.write_text(html,encoding='utf-8')
          PY
      - name: Commit patch
