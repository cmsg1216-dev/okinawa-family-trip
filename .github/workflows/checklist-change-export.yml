name: Add checklist change export

on:
  push:
    paths:
      - '.github/workflows/checklist-change-export.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add ChatGPT change export
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')

          css=r'''
          /* checklist-share-v1 */
          .change-share-btn{background:#ff735c!important;color:#fff!important;border-color:#ff735c!important}
          .change-share-hint{font-size:10px;color:#8c8c87;margin-top:6px}
          '''
          if '/* checklist-share-v1 */' not in html:
              html=html.replace('</style>',css+'\n</style>',1)

          script=r'''
          <script>
          (function(){
            if(window.__checklistShareV1 || typeof C==='undefined') return;
            window.__checklistShareV1=true;

            const prep=document.getElementById('prep'); if(!prep)return;
            const tools=prep.querySelector('.prep-tools'); if(!tools)return;

            const customKey='oki-check-custom-v1';
            const renameKey='oki-check-renames-v1';
            const deletedKey='oki-check-deleted-v1';

            const readJson=(k,fallback)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(fallback))}catch(e){return fallback}};
            const categoryName=id=>{
              const g=(typeof G!=='undefined'?G:[]).find(x=>x.id===id);
              return g ? g.name : id;
            };

            function buildChangeText(){
              const custom=readJson(customKey,[]);
              const renames=readJson(renameKey,{});
              const deleted=new Set(readJson(deletedKey,[]));
              const lines=['[오키나와 체크리스트 변경요청]'];
              let count=0;

              custom.forEach(x=>{
                const key='custom:'+x.id;
                const isDeleted=[...deleted].some(d=>{
                  if(!d.startsWith('idx:'))return false;
                  const i=Number(d.slice(4));
                  return C[i] && C[i].customId===x.id;
                });
                if(isDeleted)return;
                const name=renames[key]||x.t;
                lines.push('추가 | '+categoryName(x.cat)+' | '+name);
                count++;
              });

              Object.entries(renames).forEach(([key,name])=>{
                if(key.startsWith('custom:'))return;
                const m=key.match(/^idx:(\d+)$/); if(!m)return;
                const i=Number(m[1]), c=C[i];
                const original=c && c.t!==name ? '(기존 항목)' : '';
                lines.push('이름수정 | '+key+' | '+name+' '+original);
                count++;
              });

              deleted.forEach(key=>{
                const m=key.match(/^idx:(\d+)$/); if(!m)return;
                const i=Number(m[1]), c=C[i];
                if(c && c.custom)return;
                lines.push('삭제 | '+key+' | '+(c?c.t:'항목'));
                count++;
              });

              if(!count)return '';
              lines.push('이 변경내용을 GitHub 원본 체크리스트에 반영해줘.');
              return lines.join('\n');
            }

            async function copyText(t){
              try{await navigator.clipboard.writeText(t);return true}catch(e){
                const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
                const ok=document.execCommand('copy');ta.remove();return ok;
              }
            }

            if(!tools.querySelector('.change-share-btn')){
              const btn=document.createElement('button');
              btn.type='button';btn.className='change-share-btn';btn.textContent='ChatGPT에 변경내용 보내기';
              tools.appendChild(btn);

              const hint=document.createElement('div');
              hint.className='change-share-hint';
              hint.textContent='추가·이름수정·삭제만 전달합니다. 체크 완료 상태는 포함하지 않습니다.';
              tools.parentElement.insertBefore(hint,tools.nextSibling);

              btn.addEventListener('click',async()=>{
                const text=buildChangeText();
                if(!text){alert('아직 전달할 추가·수정·삭제 내용이 없습니다.');return}
                if(navigator.share){
                  try{
                    await navigator.share({title:'오키나와 체크리스트 변경요청',text});
                    return;
                  }catch(e){}
                }
                const ok=await copyText(text);
                alert(ok?'변경내용을 복사했습니다. ChatGPT 대화에 붙여넣어 주세요.':'복사에 실패했습니다.');
              });
            }
          })();
          </script>
          '''
          html=html.replace('</body>',script+'\n</body>',1)
          p.write_text(html,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/checklist-change-export.yml || true
          git diff --cached --quiet && exit 0
          git commit -m "Add checklist change export for ChatGPT"
          git push
