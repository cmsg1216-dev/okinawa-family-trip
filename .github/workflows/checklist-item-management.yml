name: Add checklist item management

on:
  push:
    paths:
      - '.github/workflows/checklist-item-management.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add checklist delete and restore controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')

          css=r'''
          /* checklist-manage-v1 */
          .prep-tools .manage-btn{background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)!important}
          .prep-tools .manage-btn.active{background:#fff0ec!important;color:#a94a3a!important;border-color:#efcfc6!important}
          .prep-tools .restore-btn{background:#fff!important;color:#6f6f6b!important;border:1px dashed var(--line)!important}
          .check{position:relative}.check-delete{display:none;margin-left:auto;border:0;background:transparent;color:#b24f42;font-size:10px;font-weight:800;cursor:pointer;padding:2px 4px}.manage-mode .check-delete{display:inline-flex;align-items:center}.manage-mode .check{padding-right:8px}.deleted-count{font-size:10px;color:#8d8d88;margin-left:4px}.photo-origin{font-style:normal;font-size:8px;color:#999;margin-left:5px}
          '''
          if '/* checklist-manage-v1 */' not in html:
              html=html.replace('</style>',css+'\n</style>',1)

          script=r'''
          <script>
          (function(){
            if(window.__checklistManageV1 || typeof C==='undefined') return;
            window.__checklistManageV1=true;
            const prep=document.getElementById('prep'); if(!prep)return;
            const deletedKey='oki-check-deleted-v1';
            const getDeleted=()=>{try{return new Set(JSON.parse(localStorage.getItem(deletedKey)||'[]'))}catch(e){return new Set()}};
            const setDeleted=s=>localStorage.setItem(deletedKey,JSON.stringify([...s]));
            const itemId=i=>'idx:'+i;

            const tools=prep.querySelector('.prep-tools');
            if(tools && !tools.querySelector('.manage-btn')){
              const manage=document.createElement('button');
              manage.type='button'; manage.className='manage-btn'; manage.textContent='항목 관리';
              const restore=document.createElement('button');
              restore.type='button'; restore.className='restore-btn';
              tools.appendChild(manage); tools.appendChild(restore);

              const updateRestore=()=>{const n=getDeleted().size;restore.innerHTML='삭제 항목 복구'+(n?'<span class="deleted-count">'+n+'개</span>':'');restore.disabled=n===0;restore.style.opacity=n?1:.45};
              manage.addEventListener('click',()=>{prep.classList.toggle('manage-mode');manage.classList.toggle('active');manage.textContent=prep.classList.contains('manage-mode')?'관리 끝내기':'항목 관리'});
              restore.addEventListener('click',()=>{if(!getDeleted().size)return;if(confirm('이 기기에서 삭제한 체크리스트 항목을 모두 복구할까요?')){localStorage.removeItem(deletedKey);checks();progress();updateRestore()}});
              updateRestore();
              window.__updateChecklistRestore=updateRestore;
            }

            const baseChecks=window.checks;
            window.checks=function(){
              const deleted=getDeleted();
              baseChecks();
              document.querySelectorAll('.check-section').forEach(sec=>{
                const grid=sec.querySelector('.checkgrid'); if(!grid)return;
                [...grid.querySelectorAll('.check')].forEach(label=>{
                  const span=label.querySelector('span'); if(!span)return;
                  const text=span.childNodes[0]?.textContent?.trim()||span.textContent.trim();
                  const i=C.findIndex(c=>c.t===text);
                  if(i<0)return;
                  if(deleted.has(itemId(i))){label.remove();return}
                  if(!label.querySelector('.check-delete')){
                    const del=document.createElement('button');del.type='button';del.className='check-delete';del.textContent='삭제';
                    del.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const d=getDeleted();d.add(itemId(i));setDeleted(d);checks();progress();window.__updateChecklistRestore?.()});
                    label.appendChild(del);
                  }
                });
                const visible=[...grid.querySelectorAll('.check')];
                if(!visible.length)sec.classList.add('hidden-check');
              });
              window.__updateChecklistRestore?.();
            };

            const baseProgress=window.progress;
            window.progress=function(){
              const deleted=getDeleted();
              const active=C.map((c,i)=>[c,i]).filter(([,i])=>!deleted.has(itemId(i)));
              const n=active.filter(([,i])=>done(i)).length,miss=active.length-n;
              document.getElementById('progtext').textContent=n+' / '+active.length+' 완료';
              document.getElementById('prog').style.width=(active.length?100*n/active.length:100)+'%';
              document.getElementById('missTotal').textContent=miss?('아직 '+miss+'개 남음'):'모두 준비 완료 ✅';
            };
            checks();progress();
          })();
          </script>
          '''
          html=html.replace('</body>',script+'\n</body>',1)
          p.write_text(html,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/checklist-item-management.yml || true
          git diff --cached --quiet && exit 0
          git commit -m "Add checklist item delete and restore controls"
          git push
