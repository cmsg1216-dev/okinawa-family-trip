name: Add checklist add and rename

on:
  push:
    paths:
      - '.github/workflows/checklist-add-rename.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add checklist add and rename UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')

          css=r'''
          /* checklist-edit-v2 */
          .check-edit{display:none;border:0;background:transparent;color:#5e6970;font-size:10px;font-weight:800;cursor:pointer;padding:2px 4px;margin-left:auto}.manage-mode .check-edit{display:inline-flex}.manage-mode .check-delete{margin-left:2px}
          .add-item-btn{background:#191919!important;color:#fff!important;border-color:#191919!important}
          .checklist-modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:100;align-items:center;justify-content:center;padding:18px}.checklist-modal-backdrop.open{display:flex}.checklist-modal{width:min(420px,100%);background:#fff;border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.22)}.checklist-modal h3{margin:0 0 12px;font-size:18px}.checklist-modal label{display:block;font-size:11px;font-weight:800;color:#777;margin:10px 0 5px}.checklist-modal select,.checklist-modal input{width:100%;border:1px solid #ddd;border-radius:10px;padding:11px 12px;font:inherit;font-size:13px;background:#fff}.checklist-modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.checklist-modal-actions button{border:1px solid #ddd;background:#fff;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer}.checklist-modal-actions .save{position:static!important;background:#191919!important;color:#fff!important;border-color:#191919!important;float:none!important}
          .custom-badge{font-style:normal;font-size:8px;color:#8f6d64;margin-left:5px;background:#fff0ec;border-radius:999px;padding:2px 5px}
          '''
          if '/* checklist-edit-v2 */' not in html:
              html=html.replace('</style>',css+'\n</style>',1)

          script=r'''
          <script>
          (function(){
            if(window.__checklistEditV2 || typeof C==='undefined' || typeof G==='undefined') return;
            window.__checklistEditV2=true;

            const customKey='oki-check-custom-v1';
            const renameKey='oki-check-renames-v1';
            const getCustom=()=>{try{return JSON.parse(localStorage.getItem(customKey)||'[]')}catch(e){return []}};
            const setCustom=a=>localStorage.setItem(customKey,JSON.stringify(a));
            const getRenames=()=>{try{return JSON.parse(localStorage.getItem(renameKey)||'{}')}catch(e){return {}}};
            const setRenames=o=>localStorage.setItem(renameKey,JSON.stringify(o));

            // Load persisted custom items first. Keep deterministic order so existing delete state stays stable.
            const custom=getCustom();
            custom.forEach(x=>{if(!C.some(c=>c.customId===x.id))C.push({t:x.t,cat:x.cat,customId:x.id,custom:true})});

            // Apply persisted names by stable base index/custom id.
            const renames=getRenames();
            C.forEach((c,i)=>{
              const key=c.customId?('custom:'+c.customId):('idx:'+i);
              if(renames[key])c.t=renames[key];
            });

            const prep=document.getElementById('prep'); if(!prep)return;
            const tools=prep.querySelector('.prep-tools');

            // Modal
            const back=document.createElement('div');back.className='checklist-modal-backdrop';back.innerHTML='<div class="checklist-modal" role="dialog" aria-modal="true"><h3>체크리스트 항목 추가</h3><label>분류</label><select id="newCheckCat"></select><label>항목 이름</label><input id="newCheckName" type="text" placeholder="예: 이린이 선글라스"><div class="checklist-modal-actions"><button type="button" id="newCheckCancel">취소</button><button type="button" class="save" id="newCheckSave">추가</button></div></div>';
            document.body.appendChild(back);
            const sel=back.querySelector('#newCheckCat'), inp=back.querySelector('#newCheckName');
            G.forEach(g=>{const o=document.createElement('option');o.value=g.id;o.textContent=g.icon+' '+g.name;sel.appendChild(o)});
            const close=()=>{back.classList.remove('open');inp.value=''};
            back.querySelector('#newCheckCancel').onclick=close;
            back.addEventListener('click',e=>{if(e.target===back)close()});

            if(tools && !tools.querySelector('.add-item-btn')){
              const add=document.createElement('button');add.type='button';add.className='add-item-btn';add.textContent='+ 항목 추가';
              const manage=tools.querySelector('.manage-btn');
              tools.insertBefore(add,manage||null);
              add.onclick=()=>{back.classList.add('open');setTimeout(()=>inp.focus(),50)};
            }

            back.querySelector('#newCheckSave').onclick=()=>{
              const name=inp.value.trim(),cat=sel.value;if(!name)return inp.focus();
              if(C.some(c=>c.t===name)){alert('같은 이름의 항목이 이미 있습니다.');return}
              const arr=getCustom();const id='u'+Date.now();arr.push({id,t:name,cat});setCustom(arr);
              C.push({t:name,cat,customId:id,custom:true});close();checks();progress();
            };
            inp.addEventListener('keydown',e=>{if(e.key==='Enter')back.querySelector('#newCheckSave').click()});

            const prevChecks=window.checks;
            window.checks=function(){
              prevChecks();
              document.querySelectorAll('.check').forEach(label=>{
                const span=label.querySelector('span');if(!span)return;
                const raw=[...span.childNodes].find(n=>n.nodeType===3)?.textContent?.trim()||span.textContent.trim();
                const i=C.findIndex(c=>c.t===raw);if(i<0)return;
                const c=C[i];

                if(c.custom && !span.querySelector('.custom-badge')){
                  const em=document.createElement('em');em.className='custom-badge';em.textContent='직접 추가';span.appendChild(em);
                }

                if(!label.querySelector('.check-edit')){
                  const edit=document.createElement('button');edit.type='button';edit.className='check-edit';edit.textContent='수정';
                  edit.onclick=e=>{
                    e.preventDefault();e.stopPropagation();
                    const next=prompt('항목 이름을 수정하세요.',c.t);
                    if(next===null)return;
                    const name=next.trim();if(!name||name===c.t)return;
                    if(C.some((x,j)=>j!==i&&x.t===name)){alert('같은 이름의 항목이 이미 있습니다.');return}
                    const r=getRenames();const key=c.customId?('custom:'+c.customId):('idx:'+i);r[key]=name;setRenames(r);
                    if(c.customId){
                      const arr=getCustom();const x=arr.find(x=>x.id===c.customId);if(x){x.t=name;setCustom(arr)}
                    }
                    c.t=name;checks();progress();
                  };
                  const del=label.querySelector('.check-delete');
                  label.insertBefore(edit,del||null);
                }
              });
            };

            checks();progress();
          })();
          </script>
          '''
          html=html.replace('</body>',script+'\n</body>',1)
          p.write_text(html,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/checklist-add-rename.yml || true
          git diff --cached --quiet && exit 0
          git commit -m "Add checklist add and rename controls"
          git push
