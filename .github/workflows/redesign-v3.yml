name: Apply polished travel UI

on:
  push:
    paths:
      - '.github/workflows/redesign-v3.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply design system
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          html=p.read_text(encoding='utf-8')

          css=r'''
          /* design-v3 */
          :root{
            --bg:#f6f3ee;--paper:#fffdf9;--paper-2:#f9f6f1;--ink:#173042;--muted:#6d7b85;
            --line:#e7e1d8;--ocean:#156d78;--ocean-2:#0f5963;--sea:#dff3ef;--coral:#ef7968;
            --sand:#f3e7d5;--sun:#d79a3b;--shadow:0 12px 36px rgba(35,54,62,.08);
          }
          html{scroll-behavior:smooth;background:var(--bg)}
          body{background:radial-gradient(circle at 14% 0%,#fff9ef 0,transparent 31rem),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;line-height:1.58;letter-spacing:-.015em}
          button,a{ -webkit-tap-highlight-color:transparent }
          button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid rgba(21,109,120,.25);outline-offset:2px}
          .wrap{max-width:1160px;margin:0 auto;padding:28px 24px 90px}
          h2{font-size:26px;letter-spacing:-.035em;color:var(--ink);margin:32px 0 14px}
          h3{color:var(--ink);letter-spacing:-.025em}
          .meta{color:var(--muted)}

          .hero-v3{position:relative;overflow:hidden;background:linear-gradient(132deg,#123f4c 0%,#166873 58%,#218795 100%);color:white;border-radius:30px;padding:34px 36px 30px;box-shadow:0 22px 60px rgba(20,72,82,.19)}
          .hero-v3:before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;right:-130px;top:-170px;background:rgba(255,255,255,.08)}
          .hero-v3:after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:80px;bottom:-155px;background:rgba(239,121,104,.30)}
          .hero-eyebrow{position:relative;z-index:1;font-size:11px;font-weight:850;letter-spacing:.16em;text-transform:uppercase;color:#d8eeee;margin-bottom:12px}
          .hero-main{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end}
          .hero-v3 h1{font-size:42px;line-height:1.08;letter-spacing:-.055em;margin:0 0 9px;color:#fff}
          .hero-sub{font-size:15px;color:#e7f2f2;max-width:560px}
          .hero-date{display:grid;grid-template-columns:auto auto;align-items:end;gap:0 10px;padding:13px 16px;border:1px solid rgba(255,255,255,.22);border-radius:18px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px)}
          .hero-date span{grid-column:1/3;font-size:10px;letter-spacing:.18em;font-weight:800;color:#d7ebeb}.hero-date strong{font-size:32px;line-height:1;font-weight:760}.hero-date small{font-size:12px;color:#d7ebeb;padding-bottom:2px}
          .trip-facts{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:26px}
          .trip-fact{padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.095);border:1px solid rgba(255,255,255,.12)}
          .trip-fact span{display:block;font-size:9px;letter-spacing:.11em;font-weight:800;color:#cce6e7;margin-bottom:3px}.trip-fact strong{font-size:12px;color:#fff;font-weight:720}
          .hero-actions{position:relative;z-index:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:15px}
          .hero-actions button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.10);color:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer;min-height:38px}
          .hero-actions button.primary{background:#fff;color:#174c55;border-color:#fff}.hero-share-msg{font-size:11px;color:#d8eeee;margin-left:3px}
          .trip-principle{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:14px 0 18px;box-shadow:0 5px 16px rgba(43,57,62,.035)}
          .trip-principle .dot{width:9px;height:9px;border-radius:50%;background:var(--coral);margin-top:7px;flex:none}.trip-principle b{display:block;font-size:12px;color:var(--ink);margin-bottom:1px}.trip-principle span:last-child{font-size:12px;color:var(--muted)}

          .tabs{position:sticky;top:12px;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:min(560px,100%);margin:0 auto 28px;padding:5px;border:1px solid rgba(218,211,201,.9);border-radius:18px;background:rgba(255,253,249,.88);box-shadow:0 12px 34px rgba(43,57,62,.10);backdrop-filter:blur(14px)}
          .tab{min-height:44px;border:0!important;background:transparent!important;color:var(--muted)!important;border-radius:13px!important;padding:7px 10px!important;font-size:12px!important;font-weight:760!important;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:.18s ease}
          .tab.active{background:var(--ink)!important;color:white!important;box-shadow:0 5px 12px rgba(23,48,66,.15)}
          .nav-glyph{font-size:15px;line-height:1}
          .panel.active{animation:panelIn .2s ease}@keyframes panelIn{from{opacity:.35;transform:translateY(3px)}to{opacity:1;transform:none}}

          .plan-head{margin:8px 0 14px!important}.plan-head h2{font-size:28px}.plan-head .meta{font-size:12px}
          .day-strip{gap:10px!important;margin:0 0 18px!important}
          .day-chip{background:var(--paper)!important;border:1px solid var(--line)!important;border-radius:18px!important;padding:14px 15px!important;box-shadow:none!important;transition:.18s ease}
          .day-chip:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(37,56,61,.06)!important}.day-chip b{font-size:13px!important;color:var(--ocean)!important}.day-chip span{font-size:12px!important;color:var(--muted)!important}
          .schedule-day{background:var(--paper)!important;border:1px solid var(--line)!important;border-radius:22px!important;margin:14px 0!important;box-shadow:0 8px 28px rgba(43,57,62,.045)!important}
          .schedule-title{padding:17px 18px!important;background:linear-gradient(90deg,#fbf8f2,#fffdf9)!important;border-bottom:1px solid var(--line)!important;border-left:4px solid var(--ocean)}
          .schedule-title h3{font-size:17px!important;color:var(--ink)!important}.schedule-title .route-label{font-size:11px!important;font-weight:750!important;color:var(--muted)!important}
          .schedule-table th{background:#f2eee8!important;color:#7a746c!important;padding:9px 14px!important;font-size:10px!important;letter-spacing:.08em!important;text-transform:uppercase}
          .schedule-table td{padding:12px 14px!important;border-top:1px solid #eee9e1!important;font-size:13px!important}.schedule-table .time{width:125px!important;color:var(--ocean)!important;font-size:12px}.schedule-table .activity{width:280px!important;color:var(--ink)!important}.schedule-table .note{color:#68747c!important}
          .schedule-table tr.key td{background:#fff9ef!important}.schedule-table tr.sea td{background:#f0fbf9!important}.schedule-table tr.rest td{background:#f7f4fb!important}
          .mini-badge{font-size:10px!important;padding:2px 7px!important;font-weight:780!important}.mini-badge.sea{background:#d9f4ef!important;color:#126c6e!important}.mini-badge.rest{background:#eee8f7!important;color:#6f568c!important}.mini-badge.warn{background:#fde9de!important;color:#a95543!important}
          .plan-routes{margin-top:16px!important}.plan-routes .btn{background:transparent!important;color:var(--ocean)!important;border:1px solid #bdd8d8!important;border-radius:999px!important;padding:8px 12px!important}

          .filters{gap:7px!important;margin:11px 0 15px!important}.filter{border:1px solid var(--line)!important;background:var(--paper)!important;color:var(--muted)!important;border-radius:999px!important;padding:8px 12px!important;font-size:11px!important;font-weight:760!important}.filter.active{background:var(--ink)!important;border-color:var(--ink)!important;color:white!important}
          .candidate{background:#eef7f5!important;border:1px solid #cde4df!important;border-radius:17px!important;padding:12px 14px!important;color:#47636a;font-size:12px}.candidate strong{color:var(--ocean-2)!important}
          .grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:14px!important}
          .card{position:relative;display:flex;flex-direction:column;min-height:315px;background:var(--paper)!important;border:1px solid var(--line)!important;border-radius:20px!important;padding:18px!important;box-shadow:none!important;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)!important;border-color:#d6cec2!important}.card>.meta{padding-right:88px;font-size:10px!important;text-transform:uppercase;letter-spacing:.06em;color:#8a837a!important}.card h3{font-size:18px!important;line-height:1.26;margin:8px 0 5px!important;padding-right:24px}.rate{color:var(--sun)!important;font-size:12px}.tag{align-self:flex-start;background:var(--sand)!important;color:#80644c!important;border-radius:999px!important;padding:4px 8px!important;font-size:10px!important;margin:8px 0!important}.card p{font-size:12px;color:#596a73;margin:4px 0 10px}.baby{background:var(--sea)!important;color:#35636a!important;border-radius:12px!important;padding:9px 10px!important;font-size:11px!important;margin:5px 0 12px!important}.save{position:absolute;right:14px;top:14px;float:none!important;background:#f6f1e9;border:1px solid #e9e0d3;border-radius:999px;padding:6px 8px;font-size:10px!important;color:#6f665e;cursor:pointer}.save input{accent-color:var(--coral)}.actions{margin-top:auto!important}.btn{border-radius:11px!important;padding:8px 10px!important;font-size:11px!important;font-weight:780!important;background:var(--ocean)!important;color:#fff!important}.btn.alt{background:transparent!important;color:var(--ocean)!important;border:1px solid #bfd9d8!important}.btn.dark{background:var(--ink)!important}

          .mapbox{grid-template-columns:minmax(260px,350px) 1fr!important;gap:14px!important}.maplist{background:var(--paper)!important;border:1px solid var(--line)!important;border-radius:20px!important;padding:8px!important}.item{border:0!important;border-radius:13px;padding:11px 10px!important;margin:2px 0;transition:.15s ease}.item:hover{background:#f4f0ea}.item b{font-size:12px}.mapframe{border-radius:20px!important;border:1px solid var(--line)!important;background:#eee9e2!important}

          #prep>.box{background:var(--paper)!important;border:1px solid var(--line)!important;border-radius:18px!important;padding:14px 16px!important}.progress{height:7px!important;background:#ece6de!important;margin-top:8px}.progress i,.mini-progress i{background:var(--ocean)!important}.prep-tools button{border:1px solid var(--line)!important;background:var(--paper)!important;color:var(--muted)!important;border-radius:999px!important;padding:8px 12px!important;font-size:11px!important}.prep-tools button.active{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}.prep-overview{gap:10px!important}.prep-summary{background:var(--paper)!important;border:1px solid var(--line)!important;border-radius:16px!important;padding:12px 13px!important;transition:.16s ease}.prep-summary:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(43,57,62,.05)}.prep-summary b{color:var(--ink)!important}.prep-summary.complete{background:#edf8f4!important;border-color:#cde6dc!important}.check-section{background:var(--paper)!important;border:1px solid var(--line)!important;border-radius:20px!important;padding:17px!important;margin:14px 0!important}.check{background:#faf8f4!important;border:1px solid #ebe5dc!important;border-radius:13px!important;padding:10px 11px!important;font-size:12px}.check.done{background:#eef8f4!important;border-color:#d3e8df!important;color:#78827e!important}.check input{accent-color:var(--ocean);width:17px;height:17px}.missing-note{color:#b16250!important}.all-done{color:var(--ocean)!important}

          @media(max-width:920px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.trip-facts{grid-template-columns:repeat(2,minmax(0,1fr))}.mapbox{grid-template-columns:1fr!important}.maplist{max-height:260px!important}}
          @media(max-width:760px){
            body{background:#f6f3ee}.wrap{padding:12px 12px calc(100px + env(safe-area-inset-bottom))!important}.hero-v3{border-radius:24px;padding:24px 20px 20px}.hero-main{display:block}.hero-v3 h1{font-size:32px}.hero-sub{font-size:13px}.hero-date{display:none}.trip-facts{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:20px}.trip-fact{padding:9px 10px}.hero-actions{margin-top:12px}.trip-principle{border-radius:16px;margin:10px 2px 14px}
            .tabs{position:fixed!important;top:auto!important;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;right:10px;width:auto!important;margin:0!important;border-radius:22px!important;padding:7px!important;z-index:50;box-shadow:0 16px 42px rgba(26,43,49,.22)!important}.tab{min-height:54px!important;flex-direction:column;gap:2px!important;font-size:10px!important;border-radius:16px!important}.nav-glyph{font-size:17px}.panel{padding-top:2px}.plan-head{align-items:flex-start!important}.plan-head h2{font-size:24px}.day-strip{display:flex!important;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 1px 4px;gap:8px!important;-webkit-overflow-scrolling:touch}.day-strip::-webkit-scrollbar{display:none}.day-chip{min-width:190px;scroll-snap-align:start;border-radius:16px!important}
            .schedule-day{border-radius:18px!important}.schedule-title{padding:14px 14px!important}.schedule-title h3{font-size:15px!important}.schedule-table thead{display:none!important}.schedule-table,.schedule-table tbody,.schedule-table tr,.schedule-table td{display:block!important;width:100%!important}.schedule-table tr{position:relative;padding:13px 14px 13px 27px!important;border-top:1px solid #eee9e1!important}.schedule-table tr:before{content:"";position:absolute;left:14px;top:19px;width:6px;height:6px;border-radius:50%;background:var(--ocean)}.schedule-table tr:after{content:"";position:absolute;left:16.5px;top:28px;bottom:-8px;width:1px;background:#d8d1c8}.schedule-table tr:last-child:after{display:none}.schedule-table td{border:0!important;padding:2px 0!important}.schedule-table .time{font-size:10px!important;text-transform:uppercase;letter-spacing:.04em}.schedule-table .time:before{content:none!important}.schedule-table .activity{font-size:13px!important;margin-top:2px}.schedule-table .note{font-size:11px!important;margin-top:4px!important;line-height:1.5}.schedule-table tr.key,.schedule-table tr.sea,.schedule-table tr.rest{border-left:0!important}.schedule-table tr.key td,.schedule-table tr.sea td,.schedule-table tr.rest td{background:transparent!important}
            .grid{grid-template-columns:1fr!important;gap:10px!important}.card{min-height:auto;padding:16px!important;border-radius:18px!important}.card:hover{transform:none}.filters{overflow-x:auto;flex-wrap:nowrap!important;padding-bottom:2px;-webkit-overflow-scrolling:touch}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap}.mapframe{height:360px!important}.prep-overview{display:flex!important;overflow-x:auto;gap:8px!important;padding-bottom:3px;-webkit-overflow-scrolling:touch}.prep-overview::-webkit-scrollbar{display:none}.prep-summary{min-width:155px}.checkgrid{grid-template-columns:1fr!important}.check-section{padding:14px!important}.hero-actions button{min-height:42px}
          }
          '''

          if '/* design-v3 */' not in html:
              html=html.replace('</style>',css+'\n</style>',1)

          top=r'''
          <header class="hero-v3">
            <div class="hero-eyebrow">OKINAWA · FAMILY TRIP · 2026</div>
            <div class="hero-main">
              <div>
                <h1>이린이의 첫 오키나와</h1>
                <div class="hero-sub">첫 바다를 중심으로, 무리하지 않고 잘 쉬는 3박 4일</div>
              </div>
              <div class="hero-date"><span>SEPTEMBER</span><strong>22–25</strong><small>2026</small></div>
            </div>
            <div class="trip-facts">
              <div class="trip-fact"><span>FLIGHT</span><strong>RF394 → RF393</strong></div>
              <div class="trip-fact"><span>STAY 01</span><strong>Hilton Okinawa Sesoko · 2박</strong></div>
              <div class="trip-fact"><span>STAY 02</span><strong>HOTEL COLLECTIVE · 1박</strong></div>
              <div class="trip-fact"><span>TRAVELERS</span><strong>엄마 · 아빠 · 14개월 이린이</strong></div>
            </div>
            <div class="hero-actions">
              <button type="button" class="primary" id="share">현재 상태 공유</button>
              <button type="button" id="copy">링크 복사</button>
              <span id="sharemsg" class="hero-share-msg" aria-live="polite"></span>
            </div>
          </header>
          <div class="trip-principle"><span class="dot"></span><div><b>이번 여행의 기준</b><span>이린이의 첫 바다와 낮잠을 최우선으로. 쇼핑·관광·식당은 그 사이에 자연스럽게 넣습니다.</span></div></div>
          <nav class="tabs" aria-label="여행 메뉴">
            <button class="tab active" data-p="plan"><span class="nav-glyph">◷</span><span>일정</span></button>
            <button class="tab" data-p="food"><span class="nav-glyph">⌖</span><span>맛집·카페</span></button>
            <button class="tab" data-p="map"><span class="nav-glyph">★</span><span>내 후보</span></button>
            <button class="tab" data-p="prep"><span class="nav-glyph">✓</span><span>여행 준비</span></button>
          </nav>
          '''

          pattern=r'<header class="hero">.*?</nav>'
          html,n=re.subn(pattern,top,html,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'header/nav replacement count={n}')

          p.write_text(html,encoding='utf-8')
          PY
      - name: Commit redesign and clean one-time workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/redesign-v3.yml .github/workflows/restore-schedule-ui.yml || true
          git diff --cached --quiet && exit 0
          git commit -m "Polish travel site UI UX for mobile and desktop"
          git push
