name: Merge handwritten baby checklist

on:
  push:
    paths:
      - '.github/workflows/checklist-handwritten-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge handwritten checklist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')

          css=r'''
          /* handwritten-checklist-v1 */
          .photo-origin{display:inline-flex;align-items:center;gap:4px;margin-left:5px;padding:2px 6px;border-radius:999px;background:#fff5ef;color:#a55544;font-size:9px;font-weight:800}
          .check-section[data-baby-group="1"] .check-head h3{color:#222}
          '''
          if '/* handwritten-checklist-v1 */' not in html:
              html=html.replace('</style>',css+'\n</style>',1)

          script=r'''
          <script>
          (function(){
            if(window.__handwrittenChecklistV1 || typeof C==='undefined' || typeof G==='undefined') return;
            window.__handwrittenChecklistV1=true;

            const byText=(t)=>C.find(c=>c.t===t);
            const move=(texts,cat)=>texts.forEach(t=>{const x=byText(t);if(x)x.cat=cat});
            const add=(t,cat)=>{if(!byText(t))C.push({t,cat,fromPhoto:true})};

            // 기존 항목을 사진 기준의 생활 흐름으로 재분류
            move(['아기 숟가락/포크','턱받이','빨대컵','휴대용 아기간식','음식가위','지퍼백/소분용기','라이카무에서 바나나·과일·물 구매'],'babyeat');
            move(['이린이 여벌옷/얇은 겉옷','이린이 모자'],'babywear');
            move(['물티슈/손입티슈','기저귀 교환패드'],'babywash');
            move(['유모차','아기띠','유모차 레인커버'],'babyplay');

            // 1. 먹기 - 사진에서 읽힌 준비물
            [
              '이유식','보온포트(밥통)','이유식 숟가락 3세트','이유식 턱받이','빨대컵',
              '이유식 의자','치약 & 칫솔','바나나','천때기','세척세제','집게','세척솔',
              '이유식 수저가위','약병','병원약','비타민 D','유산균','가위'
            ].forEach(t=>add(t,'babyeat'));

            // 2. 자기
            [
              '베개','이불','긴 인형','백색소음기','쪽쪽이','손도리','구스카','침대','부채'
            ].forEach(t=>add(t,'babysleep'));

            // 3. 놀기
            [
              '장난감 2개','치발기 1개 + 줄','햇빛가림천','의자 커버','소독티슈'
            ].forEach(t=>add(t,'babyplay'));

            // 4. 씻기
            [
              '바디워시','샴푸','크림·오일·피부약','수건','기저귀(나이트)','네일트리머'
            ].forEach(t=>add(t,'babywash'));

            // 5. 입기
            [
              '가제손수건 20장','잠옷','실내복','외출복','양말','턱받이','모자','메리제인'
            ].forEach(t=>add(t,'babywear'));

            // 기존 손글씨 분류와 겹치는 일반 항목도 자연스럽게 배치
            move(['기저귀 + 여분'],'babywash');

            const babyGroups=[
              {id:'babyeat',icon:'🥣',name:'이린이 · 먹기',desc:'이유식·식기·간식·영양제'},
              {id:'babysleep',icon:'🌙',name:'이린이 · 자기',desc:'숙면 루틴과 익숙한 잠자리 물품'},
              {id:'babyplay',icon:'🧸',name:'이린이 · 놀기/외출',desc:'이동·놀이·햇빛 대비'},
              {id:'babywash',icon:'🛁',name:'이린이 · 씻기/기저귀',desc:'목욕·피부·기저귀 관리'},
              {id:'babywear',icon:'👕',name:'이린이 · 입기',desc:'실내복·외출복·소품'}
            ];

            // 예전 아기 분류는 새 생활 흐름 분류로 교체
            const removeIds=new Set(['babygo','babyfood']);
            for(let i=G.length-1;i>=0;i--){if(removeIds.has(G[i].id))G.splice(i,1)}
            const insertAt=Math.max(1,G.findIndex(g=>g.id==='water'));
            const existingIds=new Set(G.map(g=>g.id));
            babyGroups.slice().reverse().forEach(g=>{if(!existingIds.has(g.id))G.splice(insertAt,0,g)});

            // 사진에서 옮긴 항목임을 보여주는 작은 표시
            const oldChecks=window.checks;
            window.checks=function(){
              oldChecks();
              document.querySelectorAll('.check-section').forEach(sec=>{
                const id=sec.id.replace('cg-','');
                if(['babyeat','babysleep','babyplay','babywash','babywear'].includes(id))sec.dataset.babyGroup='1';
              });
              document.querySelectorAll('.check').forEach(label=>{
                const span=label.querySelector('span');
                if(!span)return;
                const item=C.find(c=>c.t===span.textContent);
                if(item && item.fromPhoto && !label.querySelector('.photo-origin')){
                  const m=document.createElement('em');m.className='photo-origin';m.textContent='기존 체크리스트';
                  span.appendChild(m);
                }
              });
            };

            checks();progress();
          })();
          </script>
          '''
          html=html.replace('</body>',script+'\n</body>',1)
          p.write_text(html,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/checklist-handwritten-v1.yml || true
          git diff --cached --quiet && exit 0
          git commit -m "Merge handwritten baby packing checklist"
          git push
